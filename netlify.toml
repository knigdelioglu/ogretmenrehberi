# Netlify: yalnız öğretmenin kullandığı sınıf sunumu (apps/sunum-web)
# Gerekli ortam değişkeni: SUNUM_SIFRE (Site configuration → Environment variables)

[build]
  base = "apps/sunum-web"
  command = "npm run build"
  publish = "dist"
  # Sunumu etkilemeyen değişikliklerde (Android, EPUB, belgeler) yeniden build yapma
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../data/grade-11 ../lesson-player/scripts ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

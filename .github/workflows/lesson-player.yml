name: Lesson Player

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "apps/lesson-player/**"
      - "data/grade-11/presentation/**"
      - "data/grade-11/source/teacher-book/theme-1/**"
      - ".github/workflows/lesson-player.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/lesson-player/package.json

      - name: Install dependencies
        working-directory: apps/lesson-player
        run: npm install --no-audit --no-fund

      - name: Build canonical lesson data and app
        working-directory: apps/lesson-player
        run: npm run build

      - name: Browser smoke test and preview captures
        working-directory: apps/lesson-player
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lesson-player-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi

          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --window-size=1440,900             --dump-dom             http://127.0.0.1:4173/ > /tmp/lesson-player-dom.html

          grep -q "Karagöz" /tmp/lesson-player-dom.html
          grep -q "ÖĞRETMEN REHBERİ" /tmp/lesson-player-dom.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1366,768 \
            --dump-dom \
            "http://127.0.0.1:4173/?lesson=T11-T01-KARAGOZ&step=s15-q1" > /tmp/lesson-player-question-dom.html

          grep -q 'aria-label="Cevabı göster"' /tmp/lesson-player-question-dom.html
          if grep -q "Göster: Cevap" /tmp/lesson-player-question-dom.html; then
            echo "Legacy text answer button is still rendered."
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1366,768 \
            --dump-dom \
            "http://127.0.0.1:4173/?lesson=T11-T01-KARAGOZ&step=s15-q2" > /tmp/lesson-player-guidance-dom.html

          grep -q 'aria-label="Yönlendirmeyi göster"' /tmp/lesson-player-guidance-dom.html
          if grep -q "Göster: Yönlendirme" /tmp/lesson-player-guidance-dom.html; then
            echo "Legacy text guidance button is still rendered."
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1366,768 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-teacher.png" \
            "http://127.0.0.1:4173/?lesson=T11-T01-KARAGOZ&step=s15-q1"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-student.png" \
            "http://127.0.0.1:4173/?display=1&step=s15-q1"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-vocabulary.png" \
            "http://127.0.0.1:4173/?display=1&step=s25-q1"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-reference.png" \
            "http://127.0.0.1:4173/?display=1&step=s26-reference"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-process.png" \
            "http://127.0.0.1:4173/?display=1&step=s35-q1"


          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-mektup.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-MEKTUP&step=s36-q1"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-mektup-vocabulary.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-MEKTUP&step=s39-q1"


          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-speaking-source-limited.png" \
            "http://127.0.0.1:4173/?lesson=T11-T01-KONUSMA&step=s53-q1"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-speaking-performance.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-KONUSMA&step=s57-performance-1"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-speaking-assessment.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-KONUSMA&step=s58-self-assessment-1"


          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-dinleme-prep.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-DINLEME-IZLEME&step=s64-observation"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-dinleme-vocabulary.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-DINLEME-IZLEME&step=s65-vocabulary"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-dinleme-exit.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-DINLEME-IZLEME&step=s73-exit"


          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-yazma-plan.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-YAZMA&step=s75-plan"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-yazma-email.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-YAZMA&step=s77-write"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-yazma-self.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-YAZMA&step=s78-self"


          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-assessment-dialogue.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-DEGERLENDIRME&step=s81-q5"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-assessment-table.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-DEGERLENDIRME&step=s83-q12"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-assessment-source-limited.png" \
            "http://127.0.0.1:4173/?lesson=T11-T01-DEGERLENDIRME&step=s83-q13"


          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,900 \
            --screenshot="$GITHUB_WORKSPACE/lesson-player-theme-intro.png" \
            "http://127.0.0.1:4173/?display=1&lesson=T11-T01-GIRIS&step=s12-13-overview"

      - name: Upload lesson player preview
        uses: actions/upload-artifact@v4
        with:
          name: lesson-player-preview
          path: |
            lesson-player-teacher.png
            lesson-player-student.png
            lesson-player-vocabulary.png
            lesson-player-reference.png
            lesson-player-process.png
            lesson-player-mektup.png
            lesson-player-mektup-vocabulary.png
            lesson-player-speaking-source-limited.png
            lesson-player-speaking-performance.png
            lesson-player-speaking-assessment.png
            lesson-player-dinleme-prep.png
            lesson-player-dinleme-vocabulary.png
            lesson-player-dinleme-exit.png
            lesson-player-yazma-plan.png
            lesson-player-yazma-email.png
            lesson-player-yazma-self.png
            lesson-player-assessment-dialogue.png
            lesson-player-assessment-table.png
            lesson-player-assessment-source-limited.png
            lesson-player-theme-intro.png
            apps/lesson-player/dist
          if-no-files-found: error

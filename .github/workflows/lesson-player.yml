name: Lesson Player

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "apps/lesson-player/**"
      - "data/grade-11/presentation/**"
      - "data/grade-11/source/teacher-book/**"
      - ".github/workflows/lesson-player.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/lesson-player/package-lock.json

      - name: Install dependencies
        working-directory: apps/lesson-player
        run: npm ci --no-audit --no-fund

      - name: Build canonical lesson data and app
        working-directory: apps/lesson-player
        run: npm run build

      - name: Browser smoke test and preview captures
        working-directory: apps/lesson-player
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/lesson-player-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner."
            exit 1
          fi

          CHROME="$CHROME" npm run test:browser
          CHROME="$CHROME" node scripts/capture-lesson-player-previews.mjs \
            --base-url http://127.0.0.1:4173/ \
            --output-dir "$GITHUB_WORKSPACE"

      - name: Upload lesson player preview
        uses: actions/upload-artifact@v4
        with:
          name: lesson-player-preview
          path: |
            lesson-player-teacher.png
            lesson-player-guidance-controls.png
            lesson-player-student.png

name: Lesson Player Android 16

on:
  pull_request:
    paths:
      - "apps/lesson-player-android/**"
      - "apps/lesson-player/scripts/**"
      - "apps/lesson-player/src/teacher-workflow.json"
      - "apps/lesson-player/src/runtime-contracts.js"
      - "data/grade-11/presentation/**"
      - "data/grade-11/source/teacher-book/**"
      - ".github/workflows/lesson-player-android.yml"
  push:
    branches:
      - main
    paths:
      - "apps/lesson-player-android/**"
      - "apps/lesson-player/scripts/**"
      - "apps/lesson-player/src/teacher-workflow.json"
      - "apps/lesson-player/src/runtime-contracts.js"
      - "data/grade-11/presentation/**"
      - "data/grade-11/source/teacher-book/**"
      - ".github/workflows/lesson-player-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/lesson-player-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 16 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate canonical web data, package Android assets and compile
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          node ../lesson-player/scripts/package-android-data.mjs --check
          node ../lesson-player/scripts/test-android-data.mjs
          unzip -l "$APK" | grep -F 'assets/lesson-player/content-manifest.json'
          unzip -l "$APK" | grep -F 'assets/lesson-player/lessons.json'
          unzip -l "$APK" | grep -F 'assets/lesson-player/teacher-workflow.json'
          AAPT="$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'36'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
          "$AAPT" dump badging "$APK" | grep -F "android.permission.INTERNET"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-player-android16-phase1-debug
          path: apps/lesson-player-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android 16 emulator snapshot
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-avd-${{ runner.os }}-${{ runner.arch }}-api36-google-apis-x86_64-pixel6-v1

      - name: Create clean Android 16 emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated Android 16 emulator snapshot for cache."

      - name: Android 16 Compose UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            apps/lesson-player-android/gradlew --project-dir apps/lesson-player-android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-player-android16-instrumentation
          path: apps/lesson-player-android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

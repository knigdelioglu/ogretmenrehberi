name: QR media intake consistency

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "codex/**"
    paths:
      - 'data/grade-11/presentation/**'
      - 'data/grade-11/source/teacher-book/**/answer-bank.json'
      - 'data/grade-11/source/teacher-book/**/answer-bank/**'
      - 'data/grade-11/source/qr-media-intake-2026-10-08.json'
      - 'data/grade-11/source/qr-sources.json'
      - 'data/grade-11/source/qr-sources-worklist.md'
      - 'data/grade-11/source/qr-review-notes/**'
      - 'data/grade-11/source/qr-audio-transcription-workflow.md'
      - 'data/book/grade-11/themes/**'
      - 'apps/lesson-player/scripts/presentation-source-evidence.mjs'
      - 'apps/lesson-player/scripts/test-presentation-source-evidence.mjs'
      - 'scripts/validate-qr-media-intake.mjs'
      - 'scripts/qr_audio_transcribe.py'
      - 'scripts/tests/test_qr_audio_transcribe.py'
      - 'scripts/qr_audio_review_queue.py'
      - 'scripts/tests/test_qr_audio_review_queue.py'
      - '.github/workflows/qr-media-intake.yml'
  pull_request:
    paths:
      - 'data/grade-11/presentation/**'
      - 'data/grade-11/source/teacher-book/**/answer-bank.json'
      - 'data/grade-11/source/teacher-book/**/answer-bank/**'
      - 'data/book/grade-11/themes/**'
      - 'apps/lesson-player/scripts/presentation-source-evidence.mjs'
      - 'apps/lesson-player/scripts/test-presentation-source-evidence.mjs'
      - 'data/grade-11/source/qr-media-intake-2026-10-08.json'
      - 'data/grade-11/source/qr-sources.json'
      - 'data/grade-11/source/qr-sources-worklist.md'
      - 'data/grade-11/source/qr-review-notes/**'
      - 'scripts/validate-qr-media-intake.mjs'
      - 'scripts/qr_audio_transcribe.py'
      - 'scripts/tests/test_qr_audio_transcribe.py'
      - 'scripts/qr_audio_review_queue.py'
      - 'scripts/tests/test_qr_audio_review_queue.py'
      - 'data/grade-11/source/qr-audio-transcription-workflow.md'
      - '.github/workflows/qr-media-intake.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QR source mapping and scene provenance
        run: node scripts/validate-qr-media-intake.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test private local ASR workflow without downloading a model
        run: python -m unittest discover -s scripts/tests -p 'test_qr_audio_transcribe.py' -v
      - name: Test private ASR human-review queue
        run: python -m unittest discover -s scripts/tests -p 'test_qr_audio_review_queue.py' -v
